<!doctype html>
<html><head><meta charset="utf-8">
<script src="rough.js"></script>
<style>
  @font-face{font-family:'Caveat';font-weight:700;src:url('caveat.ttf') format('truetype')}
  @font-face{font-family:'Kalam';font-weight:400;src:url('kalam.ttf') format('truetype')}
  @font-face{font-family:'Kalam';font-weight:700;src:url('kalam-bold.ttf') format('truetype')}
  html,body{margin:0;background:#fdfcf8}
  #wrap{width:1120px;height:640px;position:relative}
  svg{position:absolute;inset:0}
  .t{position:absolute;font-family:'Caveat',cursive;color:#2b2b2b;line-height:1;white-space:nowrap;transform:translate(-50%,-50%);text-align:center}
  .lbl{position:absolute;font-family:'Kalam',cursive;color:#3a3a3a;line-height:1.15;white-space:nowrap;transform:translate(-50%,-50%);text-align:center}
  .note{position:absolute;font-family:'Kalam',cursive;line-height:1.15;transform:translate(-50%,-50%);text-align:center}
</style></head>
<body>
<div id="wrap"><svg id="s" width="1120" height="640" viewBox="0 0 1120 640"></svg></div>
<script>
const svg = document.getElementById('s');
const rc = rough.svg(svg);
const NS='http://www.w3.org/2000/svg';
function setSize(w,h){
  const wrap=document.getElementById('wrap');
  wrap.style.width=w+'px'; wrap.style.height=h+'px';
  svg.setAttribute('width',w); svg.setAttribute('height',h); svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
}
const INK='#2b2b2b', BLUE='#2563eb', GREEN='#0f9d58', RED='#d23f31',
      AMBER='#c47f17', PURPLE='#7c3aed', SLATE='#5b6b7b', PAPER='#fffef9',
      TEAL='#0f766e';

function add(node){svg.appendChild(node);}
function txt(x,y,s,{size=26,cls='t',color='#2b2b2b',w=null,anchor='c'}={}){
  const d=document.createElement('div'); d.className=cls; d.textContent=s;
  d.style.left=x+'px'; d.style.top=y+'px'; d.style.fontSize=size+'px'; d.style.color=color;
  if(w){d.style.whiteSpace='normal'; d.style.width=w+'px';}
  if(anchor==='l'){d.style.transform='translate(0,-50%)';}
  document.getElementById('wrap').appendChild(d);
}
function box(x,y,w,h,{stroke=INK,fill=null,fillStyle='hachure',rough=1.4,r=0}={}){
  const o={stroke,strokeWidth:2,roughness:rough}; if(fill){o.fill=fill;o.fillStyle=fillStyle;o.fillWeight=1.2;o.hachureGap=6;}
  add(rc.rectangle(x,y,w,h,o));
}
function line(x1,y1,x2,y2,{stroke=INK,rough=1.3,dash=null,w=2}={}){
  const o={stroke,strokeWidth:w,roughness:rough}; if(dash)o.strokeLineDash=dash; add(rc.line(x1,y1,x2,y2,o));
}
function arrow(x1,y1,x2,y2,{stroke=INK,dash=null,w=2}={}){
  line(x1,y1,x2,y2,{stroke,dash,w});
  const a=Math.atan2(y2-y1,x2-x1),L=13;
  line(x2,y2,x2-L*Math.cos(a-0.4),y2-L*Math.sin(a-0.4),{stroke,w});
  line(x2,y2,x2-L*Math.cos(a+0.4),y2-L*Math.sin(a+0.4),{stroke,w});
}
function cross(cx,cy,s,color){line(cx-s,cy-s,cx+s,cy+s,{stroke:color,w:3});line(cx-s,cy+s,cx+s,cy-s,{stroke:color,w:3});}
function check(cx,cy,color){line(cx-9,cy,cx-2,cy+8,{stroke:color,w:3});line(cx-2,cy+8,cx+11,cy-9,{stroke:color,w:3});}
// a little sketched robot "agent"
function agent(cx,cy,color,label,sub){
  const w=86,h=72,x=cx-w/2,y=cy-h/2;
  box(x,y,w,h,{stroke:color,fill:color,fillStyle:'solid',rough:1.6,r:0});
  // recolor: draw white body over, then features — simpler: outline only + light fill
  // eyes
  add(rc.circle(cx-18,cy-6,12,{stroke:'#fff',strokeWidth:2.5,fill:'#fff',fillStyle:'solid',roughness:1}));
  add(rc.circle(cx+18,cy-6,12,{stroke:'#fff',strokeWidth:2.5,fill:'#fff',fillStyle:'solid',roughness:1}));
  add(rc.circle(cx-18,cy-6,3.5,{stroke:INK,fill:INK,fillStyle:'solid'}));
  add(rc.circle(cx+18,cy-6,3.5,{stroke:INK,fill:INK,fillStyle:'solid'}));
  // mouth
  line(cx-14,cy+16,cx+14,cy+16,{stroke:'#fff',w:2.5,rough:1});
  // antenna
  line(cx,y,cx,y-14,{stroke:color,w:2.5});
  add(rc.circle(cx,y-16,7,{stroke:color,fill:color,fillStyle:'solid'}));
  if(label) txt(cx,cy+h/2+22,label,{size:26,color});
  if(sub) txt(cx,cy+h/2+44,sub,{size:19,cls:'lbl',color:'#555'});
}
function stickyNote(cx,cy,w,h,text,color){
  box(cx-w/2,cy-h/2,w,h,{stroke:color,fill:color,fillStyle:'solid',rough:1.7});
  txt(cx,cy,text,{size:20,cls:'lbl',color:'#4a1410',w:w-16});
}
function doc(cx,cy,color,poison){
  const w=58,h=74,x=cx-w/2,y=cy-h/2;
  box(x,y,w,h,{stroke:color,fill:PAPER,fillStyle:'solid',rough:1.4});
  for(let i=0;i<4;i++) line(x+10,y+16+i*12,x+w-10,y+16+i*12,{stroke:color,w:1.4,rough:1});
  if(poison){add(rc.circle(cx+22,cy-30,20,{stroke:RED,fill:'#fdecea',fillStyle:'solid',roughness:1.6}));txt(cx+22,cy-30,'☠',{size:20,color:RED});}
}
function card(cx,cy,text,color){
  const w=150,h=44;box(cx-w/2,cy-h/2,w,h,{stroke:color,fill:'#f2fbf5',fillStyle:'solid',rough:1.3});
  txt(cx,cy,text,{size:19,cls:'lbl',color:'#0b5c2e',w:w-12});
}
function title(t,sub){ txt(60,44,t,{size:40,anchor:'l'}); if(sub) txt(60,80,sub,{size:22,cls:'lbl',color:'#666',anchor:'l'}); }
function badge(num,color,x=1050){ add(rc.circle(x,52,60,{stroke:color,fill:color,fillStyle:'solid',roughness:1.6})); txt(x,52,num,{size:34,color:'#fff'}); }

// a hooded third party — the attacker who never talks to your agent
function villain(cx,cy,{color=RED}={}){
  // shoulders
  add(rc.polygon([[cx-58,cy+104],[cx-42,cy+48],[cx+42,cy+48],[cx+58,cy+104]],
      {stroke:color,strokeWidth:2.2,fill:'#fdecea',fillStyle:'solid',roughness:1.8}));
  // hood
  add(rc.polygon([[cx,cy-52],[cx+36,cy-4],[cx+30,cy+46],[cx-30,cy+46],[cx-36,cy-4]],
      {stroke:color,strokeWidth:2.2,fill:'#fdecea',fillStyle:'solid',roughness:1.7}));
  // face in shadow
  add(rc.ellipse(cx,cy+4,46,50,{stroke:color,strokeWidth:1.6,fill:'#3a3a3a',fillStyle:'solid',roughness:1.5}));
  add(rc.circle(cx-10,cy,8,{stroke:'#fff',fill:'#fff',fillStyle:'solid',roughness:1}));
  add(rc.circle(cx+10,cy,8,{stroke:'#fff',fill:'#fff',fillStyle:'solid',roughness:1}));
}
// a sketched database cylinder
function db(cx,cy,{color=SLATE,poison=false}={}){
  const w=156,h=124,rx=w/2,ry=21;
  add(rc.ellipse(cx,cy+h/2-ry,w,ry*2,{stroke:color,strokeWidth:2,fill:PAPER,fillStyle:'solid',roughness:1.4}));
  add(rc.rectangle(cx-rx,cy-h/2+ry,w,h-2*ry,{stroke:PAPER,fill:PAPER,fillStyle:'solid',roughness:1}));
  line(cx-rx,cy-h/2+ry,cx-rx,cy+h/2-ry,{stroke:color,w:2});
  line(cx+rx,cy-h/2+ry,cx+rx,cy+h/2-ry,{stroke:color,w:2});
  add(rc.ellipse(cx,cy-h/2+ry*1.6,w,ry*2,{stroke:color,strokeWidth:1.4,roughness:1.3}));
  add(rc.ellipse(cx,cy-h/2+ry,w,ry*2,{stroke:color,strokeWidth:2,fill:PAPER,fillStyle:'solid',roughness:1.4}));
  if(poison){
    add(rc.circle(cx+62,cy-h/2-4,34,{stroke:RED,fill:'#fdecea',fillStyle:'solid',roughness:1.6}));
    txt(cx+62,cy-h/2-4,'\u2620',{size:24,color:RED});
  }
}
// numbered step marker
function stepBadge(cx,cy,n,color){
  add(rc.circle(cx,cy,36,{stroke:color,strokeWidth:2.2,fill:'#fffef9',fillStyle:'solid',roughness:1.5}));
  txt(cx,cy,n,{size:21,cls:'lbl',color});
}

// a human — deliberately not a robot, and in its own colour
function person(cx,cy,{color=TEAL}={}){
  add(rc.polygon([[cx-27,cy+46],[cx-21,cy-14],[cx+21,cy-14],[cx+27,cy+46]],
      {stroke:color,strokeWidth:2.3,fill:'#effcf9',fillStyle:'solid',roughness:1.6}));
  line(cx-21,cy-6,cx-45,cy+26,{stroke:color,w:2.3});
  line(cx+21,cy-6,cx+45,cy+26,{stroke:color,w:2.3});
  line(cx-13,cy+46,cx-18,cy+88,{stroke:color,w:2.3});
  line(cx+13,cy+46,cx+18,cy+88,{stroke:color,w:2.3});
  add(rc.circle(cx,cy-44,40,{stroke:color,strokeWidth:2.4,fill:'#effcf9',fillStyle:'solid',roughness:1.4}));
  add(rc.circle(cx-8,cy-49,5,{stroke:color,fill:color,fillStyle:'solid',roughness:1}));
  add(rc.circle(cx+8,cy-49,5,{stroke:color,fill:color,fillStyle:'solid',roughness:1}));
  line(cx-8,cy-34,cx+8,cy-34,{stroke:color,w:1.8,rough:1});
}
// a light note, readable — unlike a solid red sticky
function payloadNote(cx,cy,w,h,text,color){
  box(cx-w/2,cy-h/2,w,h,{stroke:color,fill:'#fdecea',fillStyle:'solid',rough:1.6});
  txt(cx,cy,text,{size:18,cls:'lbl',color:'#8f2318',w:w-22});
}

// a labelled sketch box with title + subtitle
function labelBox(cx,cy,w,h,title,sub,color,fill){
  box(cx-w/2,cy-h/2,w,h,{stroke:color,fill:fill||'#fff',fillStyle:'solid',rough:1.4});
  txt(cx,cy-(sub?9:0),title,{size:24,color});
  if(sub) txt(cx,cy+16,sub,{size:17,cls:'lbl',color:'#555',w:w-14});
}
function guardNote(cx,cy,num,name,color){
  const w=210,h=58; box(cx-w/2,cy-h/2,w,h,{stroke:color,fill:'#fffef4',fillStyle:'solid',rough:1.6});
  add(rc.circle(cx-w/2+26,cy,34,{stroke:color,fill:color,fillStyle:'solid',roughness:1.6}));
  txt(cx-w/2+26,cy,num,{size:20,color:'#fff'});
  txt(cx+14,cy,name,{size:20,cls:'lbl',color,w:w-70});
}
