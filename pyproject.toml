[project]
name = "prompt-injection-patterns"
version = "0.2.0"
description = "LangGraph blueprints and teaching notebooks for defending LLM agents against prompt injection (arXiv:2506.08837)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "damian" }]
keywords = ["llm", "security", "prompt-injection", "agents", "langgraph", "owasp"]
dependencies = [
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "langgraph>=1.0",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
llm = [
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
]
learning = [
  "notebook>=7.0",
  "nbclient>=0.9",
  "nbformat>=5.10",
  "ipykernel>=6.29",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blueprint*", "legacy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
