name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PIP_MODE: mock   # offline injectable mock — never needs an API key in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Attack/defence suite
        run: pytest -v
      - name: Benchmark smoke run
        run: python -m blueprint.benchmark
